<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Illustration — Terminal</title>
  <style>
    :root {
      --yellow: #e8c565;
      --light: #f5ecd6;
    }

    body {
      margin: 0;
      padding: 40px;
      background: #f7f6f4;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
    }

    .tile {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 180px;
      height: 180px;
    }
  </style>
</head>

<body>

  <div class="tile">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="35" width="160" height="130" fill="var(--light)" stroke="#111" stroke-width="1.4" />
      <rect x="20" y="35" width="160" height="32" fill="var(--yellow)" stroke="#111" stroke-width="1.4" />
      <rect x="32" y="47" width="8" height="8" fill="var(--light)" stroke="#111" stroke-width="1" />
      <rect x="46" y="47" width="8" height="8" fill="var(--light)" stroke="#111" stroke-width="1" />
      <rect x="60" y="47" width="8" height="8" fill="var(--light)" stroke="#111" stroke-width="1" />
      <path d="M36 88 l16 13 l-16 13" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="square"
        stroke-linejoin="miter" />
      <line x1="60" y1="114" x2="118" y2="114" stroke="#111" stroke-width="1.4" stroke-linecap="square" />

      <rect x="160" y="140" width="12" height="16" fill="var(--yellow)" stroke="#111" stroke-width="1.1" />
    </svg>
  </div>

</body>

</html>
