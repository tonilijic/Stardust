<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Illustration — Circles</title>
<style>
  :root { --yellow: #e8c565; --light: #f5ecd6; }
  body {
    margin: 0;
    padding: 40px;
    background: #f7f6f4;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
  }
  .tile { width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
  svg { width: 180px; height: 180px; }
  .part { transition: fill 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
</style>
</head>
<body>

<div class="tile">
  <svg class="shape" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle class="part" cx="100" cy="100" r="80" fill="var(--light)" stroke="#111" stroke-width="1.1"/>
    <circle class="part" cx="100" cy="100" r="58" fill="var(--light)" stroke="#111" stroke-width="1.1"/>
    <circle class="part" cx="100" cy="100" r="36" fill="var(--light)" stroke="#111" stroke-width="1.1"/>
    <circle class="part" cx="100" cy="100" r="15" fill="var(--yellow)" stroke="#111" stroke-width="1.1"/>
  </svg>
</div>

<script>
  document.querySelectorAll('.shape').forEach(function (svg) {
    var parts = svg.querySelectorAll('.part');
    svg.addEventListener('mouseenter', function () {
      var yellowIndex = Math.floor(Math.random() * parts.length);
      parts.forEach(function (p, i) {
        p.setAttribute('fill', i === yellowIndex ? 'var(--yellow)' : 'var(--light)');
      });
    });
  });
</script>

</body>
</html>
