<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Illustration — ChatGPT</title>
<style>
  :root { --yellow: #e8c565; --light: #f5ecd6; }
  body {
    margin: 0;
    padding: 40px;
    background: #f7f6f4;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
  }
  .tile { width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
  svg { width: 180px; height: 180px; }
</style>
</head>
<body>

<div class="tile">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="30" width="120" height="70" fill="var(--light)" stroke="#111" stroke-width="1.4"/>
    <polygon points="38,100 58,100 38,122" fill="var(--light)" stroke="#111" stroke-width="1.4" stroke-linejoin="miter"/>
    <line x1="38" y1="52" x2="118" y2="52" stroke="#111" stroke-width="1.1" stroke-linecap="square"/>
    <line x1="38" y1="68" x2="98" y2="68" stroke="#111" stroke-width="1.1" stroke-linecap="square"/>

    <rect x="66" y="108" width="114" height="62" fill="var(--yellow)" stroke="#111" stroke-width="1.4"/>
    <polygon points="162,170 180,170 180,190" fill="var(--yellow)" stroke="#111" stroke-width="1.4" stroke-linejoin="miter"/>
    <line x1="84" y1="128" x2="162" y2="128" stroke="#111" stroke-width="1.1" stroke-linecap="square"/>
    <line x1="84" y1="144" x2="140" y2="144" stroke="#111" stroke-width="1.1" stroke-linecap="square"/>
  </svg>
</div>

</body>
</html>
