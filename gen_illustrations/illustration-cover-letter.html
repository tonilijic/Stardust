<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Illustration — Cover letter</title>
<style>
  :root { --yellow: #e8c565; --light: #f5ecd6; }
  body {
    margin: 0;
    padding: 40px;
    background: #f7f6f4;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
  }
  .tile { width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
  svg { width: 180px; height: 180px; }
</style>
</head>
<body>

<div class="tile">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="50" width="160" height="120" fill="var(--light)" stroke="#111" stroke-width="1.4"/>
    <polygon points="20,50 180,50 100,115" fill="var(--yellow)" stroke="#111" stroke-width="1.4" stroke-linejoin="miter"/>
    <line x1="45" y1="140" x2="115" y2="140" stroke="#111" stroke-width="1.4" stroke-linecap="square"/>
    <line x1="45" y1="155" x2="95" y2="155" stroke="#111" stroke-width="1.4" stroke-linecap="square"/>
    <rect x="132" y="128" width="34" height="34" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="3 3"/>
  </svg>
</div>

</body>
</html>
