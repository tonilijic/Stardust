<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Illustration — Generating</title>
  <style>
    :root {
      --yellow: #e8c565;
      --light: #f5ecd6;
    }

    body {
      margin: 0;
      padding: 40px;
      background: #f7f6f4;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
    }

    .tile {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 180px;
      height: 180px;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        fill: var(--light);
      }

      50% {
        fill: var(--yellow);
      }
    }

    .dot {
      stroke: #111;
      stroke-width: 2;
      animation: pulse-dot 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
</head>

<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="pixelGlyph" viewBox="0 0 56 64">
        <rect x="0" y="16" width="8" height="8" />
        <rect x="8" y="16" width="8" height="8" />
        <rect x="16" y="16" width="8" height="8" />
        <rect x="0" y="24" width="8" height="8" />
        <rect x="8" y="24" width="8" height="8" />
        <rect x="16" y="24" width="8" height="8" />
        <rect x="0" y="40" width="8" height="8" />
        <rect x="8" y="40" width="8" height="8" />
        <rect x="16" y="40" width="8" height="8" />
        <rect x="0" y="48" width="8" height="8" />
        <rect x="8" y="48" width="8" height="8" />
        <rect x="16" y="48" width="8" height="8" />
        <rect x="40" y="0" width="8" height="8" />
        <rect x="48" y="0" width="8" height="8" />
        <rect x="40" y="8" width="8" height="8" />
        <rect x="40" y="16" width="8" height="8" />
        <rect x="32" y="24" width="8" height="8" />
        <rect x="32" y="32" width="8" height="8" />
        <rect x="40" y="40" width="8" height="8" />
        <rect x="40" y="48" width="8" height="8" />
        <rect x="40" y="56" width="8" height="8" />
        <rect x="48" y="56" width="8" height="8" />
      </symbol>
    </defs>
  </svg>

  <div class="tile">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <polygon points="55,25 115,25 145,55 145,165 55,165" fill="var(--light)" stroke="#111" stroke-width="1.4"
        stroke-linejoin="miter" />
      <polygon points="115,25 145,55 115,55" fill="var(--yellow)" stroke="#111" stroke-width="1.4"
        stroke-linejoin="miter" />
      <g transform="rotate(-8 100 100)">
        <rect x="75" y="75" width="50" height="50" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="3 3" />
        <use href="#pixelGlyph" x="80" y="79" width="40" height="42" fill="var(--yellow)" />
      </g>

    </svg>
  </div>

</body>

</html>
