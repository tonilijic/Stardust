<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Illustration — Todo app</title>
<style>
  :root { --yellow: #e8c565; --light: #f5ecd6; }
  body {
    margin: 0;
    padding: 40px;
    background: #f7f6f4;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
  }
  .tile { width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
  svg { width: 180px; height: 180px; }
</style>
</head>
<body>

<div class="tile">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="30" y="25" width="140" height="150" fill="var(--light)" stroke="#111" stroke-width="1.4"/>

    <rect x="45" y="45" width="18" height="18" fill="var(--yellow)" stroke="#111" stroke-width="1.1"/>
    <path d="M48 54 l5 5 l10 -12" fill="none" stroke="#111" stroke-width="1.1" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="75" y1="54" x2="150" y2="54" stroke="#111" stroke-width="1.4" stroke-linecap="square"/>

    <rect x="45" y="80" width="18" height="18" fill="var(--light)" stroke="#111" stroke-width="1.1"/>
    <line x1="75" y1="89" x2="150" y2="89" stroke="#111" stroke-width="1.4" stroke-linecap="square"/>

    <rect x="45" y="115" width="18" height="18" fill="var(--light)" stroke="#111" stroke-width="1.1"/>
    <line x1="75" y1="124" x2="150" y2="124" stroke="#111" stroke-width="1.4" stroke-linecap="square"/>

    <rect x="45" y="150" width="18" height="18" fill="var(--light)" stroke="#111" stroke-width="1.1"/>
    <line x1="75" y1="159" x2="150" y2="159" stroke="#111" stroke-width="1.4" stroke-linecap="square"/>
  </svg>
</div>

</body>
</html>
